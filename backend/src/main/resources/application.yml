spring:
  application:
    name: app
  datasource:
    # 接続情報は .env を単一の真実とし、make が環境変数として渡す。
    # 素の `./gradlew bootRun` では下の既定値になり、他アプリとDBを共有してしまうので注意。
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:app}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app}
  jpa:
    hibernate:
      # スキーマ変更はFlyway管理。自動生成に頼らずvalidate固定。
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# DynamoDB Local。本番では endpoint を空文字にする。
aws:
  region: ap-northeast-1
  accessKeyId: local
  secretAccessKey: local
  dynamodb:
    endpoint: http://localhost:8000
